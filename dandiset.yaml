dateCreated: '2026-05-12T23:02:01.488781+00:00'
description: "This dataset contains calcium imaging, simultaneous behavioral data,
  and fiber photometry data from male mice in NWB format.  The calcium imaging was
  performed in the anterior insular cortex (aIC) and simultaneously recorded behavioral
  data were obtained during a social exclusion task. Fiber photometry was used to
  capture oxytocinergic, dopaminergic and endocannabinoid dynamics within the aIC
  while mice underwent the same social exclusion task or a secondary task to monitor
  responses to either innocuous or nociceptive stimuli.  See preprint for protocol
  details: Jia, C. et al. \"Social Exclusion Amplifies Behavioral Responses to Physical
  Pain via Insular Neuromodulation\" bioRxiv, 2025.05.09. https://www.biorxiv.org/content/10.1101/2025.05.09.653162v1.\n"
